version: '3.8'
services:
  acf-engine:
    build: .
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config.yml:/app/config.yml
    restart: unless-stopped
  acf-dashboard:
    build: .
    command: python3 app.py
    environment:
      # Required for public deployments. Replace before running docker compose.
      ACF_DASHBOARD_PASSWORD: ${ACF_DASHBOARD_PASSWORD:?set ACF_DASHBOARD_PASSWORD}
    network_mode: "host"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config.yml:/app/config.yml
    restart: unless-stopped
