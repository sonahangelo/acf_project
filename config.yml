# ACF Configuration

interface: ""
bpf_filter: "ip"
flush_every: 20
contamination: 0.02
dry_run: true

scan_window_seconds: 5
flow_timeout_seconds: 30

syn_window_seconds: 5
syn_flood_threshold: 20

port_repeat_window_seconds: 10
