# ACF Configuration

interface: ""
bpf_filter: "arp or ip"
flush_every: 20
contamination: 0.02
dry_run: true

scan_window_seconds: 5
flow_timeout_seconds: 30

syn_window_seconds: 5
syn_flood_threshold: 20

port_repeat_window_seconds: 10
port_repeat_threshold: 8

exfil_bytes_threshold: 5000000
exfil_min_duration_seconds: 5

scan_zscore_threshold: 3.0
scan_min_distinct_ports: 5

dns_window_seconds: 10
dns_min_distinct_subdomains: 15
dns_entropy_threshold: 3.5
dns_min_label_length: 20

whitelist:
  - "127.0.0.1"
  - "172.27.112.1"    # WSL gateway -- never block this
  - "172.27.112.252"  # this machine's own WSL IP -- never block yourself

db_path: "data/acf.db"
model_path: "models/anomaly_model.pkl"
